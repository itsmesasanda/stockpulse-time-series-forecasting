
services:
  postgres:
    image: postgres:16-alpine
    container_name: stockpulse-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: stockpulse
      POSTGRES_PASSWORD: ${docker_password}
      POSTGRES_DB: postgresql+psycopg://stockpulse:replace_with_a_strong_password@localhost:5433/stockpulse_db

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpulse -d stockpulse_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
